<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arquivo Morto — Caso 001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#D8D0BF; --paper:#FBF8F1; --paper-2:#F1EBDD; --ink:#24211D; --muted:#6B645A;
  --line:#BDB3A2; --red:#7A1E1E; --red-soft:#F0DCD8; --ok:#2F5D3A; --ok-soft:#DCE8DA;
  --folder:#C8B68A; --nav:#2A2723; --nav-ink:#EDE6D6; --nav-active:#E2C88A;
  --d-B:#E8DCBC; --d-E:#D8E0D1; --d-S:#EAD6D1; --d-C:#D5DDE4; --d-F:#E3D3BD;
  --wall:#2A2723; --win:#5C86A8;
  --p-Ed:#7A1E1E; --p-Ar:#8A5A2B; --p-Vi:#2F6B4F; --p-El:#5B4B8A; --p-Th:#2C5D8A; --p-He:#4E4B47;
  --serif:"Courier Prime","Courier New",Courier,monospace;
  --sans:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#1D1C1A; --paper:#2A2824; --paper-2:#33302B; --ink:#ECE5D6; --muted:#A49C8D;
    --line:#4B463E; --red:#D06A62; --red-soft:#43282A; --ok:#7DB58A; --ok-soft:#263A2B;
    --folder:#4A4133; --nav:#121110; --nav-ink:#DCD4C3; --nav-active:#E2C88A;
    --d-B:#3B3426; --d-E:#2F3A31; --d-S:#3E2F2D; --d-C:#2D353C; --d-F:#3D3226;
    --wall:#D9D0BE; --win:#86AFD0;
    --p-Ed:#D06A62; --p-Ar:#C9925A; --p-Vi:#6FB38F; --p-El:#A495D6; --p-Th:#79A8D6; --p-He:#B3ADA4;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --desk:#1D1C1A; --paper:#2A2824; --paper-2:#33302B; --ink:#ECE5D6; --muted:#A49C8D;
    --line:#4B463E; --red:#D06A62; --red-soft:#43282A; --ok:#7DB58A; --ok-soft:#263A2B;
    --folder:#4A4133; --nav:#121110; --nav-ink:#DCD4C3; --nav-active:#E2C88A;
    --d-B:#3B3426; --d-E:#2F3A31; --d-S:#3E2F2D; --d-C:#2D353C; --d-F:#3D3226;
    --wall:#D9D0BE; --win:#86AFD0;
    --p-Ed:#D06A62; --p-Ar:#C9925A; --p-Vi:#6FB38F; --p-El:#A495D6; --p-Th:#79A8D6; --p-He:#B3ADA4;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.5 var(--sans);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--nav-active);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--nav-ink);
  display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem}
header.top .t{flex:1;min-width:0}
header.top .t b{display:block;font:700 1.05rem/1.2 var(--serif);letter-spacing:.02em}
header.top .t span{font-size:.78rem;opacity:.75}
.hbtn{background:transparent;border:1px solid rgba(237,230,214,.35);color:var(--nav-ink);border-radius:999px;padding:.35rem .8rem;font-size:.85rem}

main{max-width:720px;margin:0 auto;padding:1rem 1rem calc(5.5rem + env(safe-area-inset-bottom,0px))}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom button{background:none;border:0;color:var(--nav-ink);opacity:.7;padding:.55rem .2rem .6rem;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;position:relative;min-height:56px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{opacity:1;color:var(--nav-active)}
nav.bottom .dot{position:absolute;top:.45rem;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red)}

h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
h2{font-size:1.35rem;margin:1.5rem 0 .6rem}
h3{font-size:1.05rem;margin:1.2rem 0 .4rem}
p{margin:.5rem 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* folder hero */
.folder{background:var(--folder);border-radius:4px 14px 4px 4px;padding:1.2rem 1.1rem 1.1rem;position:relative;margin-top:.4rem}
.folder::before{content:"";position:absolute;left:0;top:-14px;width:42%;height:16px;background:var(--folder);border-radius:6px 6px 0 0}
.folder .no{font:700 .85rem var(--serif);opacity:.8}
.folder h1{font-size:1.7rem;margin:.3rem 0 .5rem}
.folder p{max-width:60ch}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:1rem 1.05rem;margin:.8rem 0}
.sheet.typed{font-family:var(--serif);font-size:.98rem;line-height:1.6}
.progress{display:flex;gap:1rem;flex-wrap:wrap;font-size:.9rem}
.progress div b{display:block;font:700 1.3rem var(--serif)}
.rules li{margin:.35rem 0}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:.7rem 1rem;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* doc list */
.lvl{margin:1.2rem 0 .4rem;font:700 .95rem var(--serif);color:var(--muted)}
.doclist{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.docitem{width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:3px;
  padding:.65rem .8rem;display:flex;gap:.7rem;align-items:baseline}
.docitem.unread{border-left-color:var(--red)}
.docitem .id{font:700 .9rem var(--serif);min-width:2.6rem}
.docitem .ti{flex:1}
.docitem .tag{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .45rem;color:var(--muted)}
.docitem .new{font-size:.72rem;color:var(--red);font-weight:600}
.locked{margin-top:1rem;padding:.8rem;border:1px dashed var(--line);border-radius:3px;color:var(--muted);font-size:.9rem}

/* doc overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,18,16,.55);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.panel{background:var(--paper);color:var(--ink);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:12px 12px 0 0;
  padding:1rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.panel .bar{display:flex;align-items:center;gap:.6rem;position:sticky;top:-1rem;background:var(--paper);padding:.6rem 0 .5rem;margin-top:-.6rem;border-bottom:1px solid var(--line)}
.panel .bar h2{margin:0;flex:1;font-size:1.15rem}
.panel .body{font-family:var(--serif);font-size:1rem;line-height:1.62;padding-top:.6rem}
.panel .body blockquote{margin:.6rem 0;padding:.2rem 0 .2rem .9rem;border-left:3px solid var(--line)}
.panel .meta{font-style:italic;color:var(--muted)}
.stamp{display:inline-block;font:700 .82rem var(--serif);letter-spacing:.06em;padding:.15rem .5rem;border:2px solid currentColor;border-radius:3px;transform:rotate(-2deg);margin:.6rem .5rem .2rem 0}
.stamp.ok{color:var(--ok)} .stamp.no{color:var(--red)}
.stampline{margin:.3rem 0 .8rem}
table.t{border-collapse:collapse;width:100%;font-size:.9rem;margin:.6rem 0}
table.t th,table.t td{border:1px solid var(--line);padding:.35rem .45rem;text-align:left;vertical-align:top}
table.t th{background:var(--paper-2);font-weight:700}
.tw{overflow-x:auto}

/* people */
.person{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:.9rem 1rem;margin:.7rem 0;border-top:5px solid var(--pc)}
.person h3{margin:0;font-size:1.1rem}
.person .role{font-size:.85rem;color:var(--muted);margin:.1rem 0 .4rem}
.person .decl{font-family:var(--serif);font-size:.95rem;margin:.5rem 0;padding-left:.8rem;border-left:3px solid var(--line)}
.pos{display:flex;gap:.5rem;align-items:flex-start;font-size:.9rem;margin:.35rem 0}
.pill{font-size:.72rem;font-weight:700;border-radius:999px;padding:.12rem .5rem;white-space:nowrap}
.pill.decl{background:var(--paper-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--red-soft);color:var(--red)}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:3px;margin:.2rem 0 1rem}
.seg button{background:none;border:0;border-radius:6px;padding:.5rem;font-weight:600;font-size:.9rem;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* plant */
.plan-wrap{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:.6rem .5rem .8rem}
.plan{display:grid;grid-template-columns:1.2rem repeat(6,1fr);grid-template-rows:1.2rem repeat(6,auto);max-width:460px;margin:0 auto;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:0 0}
.plan .lab{font:700 .75rem var(--serif);color:var(--muted);display:flex;align-items:center;justify-content:center}
.cell{position:relative;aspect-ratio:1;border:0;padding:0;background:var(--dc);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 .5px rgba(80,70,60,.25)}
.cell .ob{position:absolute;inset:6%;border:1.5px solid var(--wall);border-radius:2px;opacity:.75;
  background:repeating-linear-gradient(45deg,transparent 0 4px,color-mix(in srgb,var(--wall) 35%,transparent) 4px 5px)}
.cell .seat{position:absolute;inset:22%;border:1.5px solid var(--wall);border-radius:30%;opacity:.55}
.cell .lbl{position:absolute;left:0;right:0;bottom:2px;font:600 8.5px/1 var(--sans);text-align:center;color:var(--muted);pointer-events:none;letter-spacing:-.01em}
.cell .ob + .lbl{color:var(--ink);opacity:.75}
.cell.wt{border-top:3px solid var(--wall)} .cell.wb{border-bottom:3px solid var(--wall)}
.cell.wl{border-left:3px solid var(--wall)} .cell.wr{border-right:3px solid var(--wall)}
.cell.winL{border-left:5px double var(--win)} .cell.winR{border-right:5px double var(--win)}
.cell.doorB{border-bottom:3px dashed var(--win)}
.cell .tok{position:relative;z-index:2;width:72%;aspect-ratio:1;border-radius:50%;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center;
  font:700 .82rem var(--sans);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.cell .tok.victim{background:transparent;color:var(--pc);border:2.5px solid var(--pc)}
.cell .mk{position:relative;z-index:1;font:700 1.15rem var(--sans);color:var(--red)}
.cell .ax{position:relative;z-index:1;font:600 .95rem var(--sans);color:var(--muted);opacity:.5}
.cell.conflict{outline:3px solid var(--red);outline-offset:-3px;z-index:3}
.cell.sel{outline:2px solid var(--nav-active);outline-offset:-2px}
.dname{position:absolute;top:2px;left:3px;font:700 8px/1 var(--sans);color:var(--muted);pointer-events:none;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0 .4rem}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.35rem .7rem .35rem .35rem;display:flex;align-items:center;gap:.4rem;font-size:.85rem;min-height:40px}
.chip .tk{width:24px;height:24px;border-radius:50%;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center;font:700 .68rem var(--sans)}
.chip .tk.victim{background:transparent;border:2px solid var(--pc);color:var(--pc)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--ink)}
.chip .co{font:700 .78rem var(--serif);color:var(--muted)}
.info{min-height:2.6em;font-size:.88rem;color:var(--muted);margin:.4rem 0}
.status{font-size:.88rem;margin:.3rem 0}
.status.bad{color:var(--red);font-weight:600}
.toggle{display:flex;align-items:center;gap:.5rem;font-size:.88rem;margin:.6rem 0}
.toggle input{width:20px;height:20px}
.cell.ref::after{content:"";position:absolute;inset:2px;border:3px dashed var(--nav-active);border-radius:4px;z-index:4;pointer-events:none}
.cell.refd::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--nav-active) 30%,transparent);pointer-events:none;z-index:1}
.banner{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--pc,var(--line));border-radius:3px;padding:.6rem .8rem;margin:.6rem 0 .8rem;font-size:.95rem;line-height:1.45}
.banner b{font-family:var(--serif)}
.chip .sd{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.chip .sd.ok{background:var(--ok)} .chip .sd.no{background:var(--red)}
.chip .nw{font-size:.68rem;color:var(--red);font-weight:700}
.sum{font:600 1rem/1.5 var(--sans);background:var(--paper-2);border-left:4px solid var(--nav-active);padding:.6rem .8rem;margin:.4rem 0 .8rem}
details.full summary{cursor:pointer;color:var(--muted);font-family:var(--sans);font-size:.9rem;padding:.5rem 0;min-height:44px}

/* grids */
.grid{border-collapse:collapse;margin:.4rem 0 1rem;font-size:.82rem;width:100%;table-layout:fixed}
.grid th{font-weight:600;padding:.25rem .15rem;text-align:center;color:var(--muted);font-size:.74rem;line-height:1.2;word-break:break-word}
.grid th.rh{text-align:left;color:var(--ink);font-size:.82rem;width:24%}
.grid td{padding:0;border:1px solid var(--line);background:var(--paper)}
.grid td button{width:100%;height:42px;border:0;background:transparent;font:700 1.05rem var(--sans)}
.grid td button.v{color:var(--ok);background:var(--ok-soft)}
.grid td button.x{color:var(--red)}
.grid td button.q{color:var(--muted)}
.grid td button.ax{color:var(--muted);opacity:.4;font-weight:500}
.grid td button.bad{outline:3px solid var(--red);outline-offset:-3px}
.gwarn{color:var(--red);font-weight:600;font-size:.88rem}
textarea{width:100%;min-height:9rem;font:1rem/1.5 var(--serif);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:.7rem}

/* accuse */
.field{margin:.7rem 0}
.field label{display:block;font-weight:600;font-size:.9rem;margin-bottom:.25rem}
select{width:100%;min-height:46px;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.4rem .6rem}
.verdict{padding:.9rem 1rem;border-radius:3px;margin:.8rem 0;font-weight:600}
.verdict.bad{background:var(--red-soft);color:var(--red)}
.score td:last-child{text-align:right;font-weight:700}
.big{font:700 2.4rem/1 var(--serif)}

.toast{position:fixed;left:50%;bottom:calc(5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);
  padding:.6rem 1rem;border-radius:6px;font-size:.88rem;max-width:90%;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
nav.bottom{grid-template-columns:repeat(4,1fr)}
.cell .wp{position:absolute;top:2px;right:2px;left:2px;font:700 7.5px/1 var(--sans);color:var(--red);text-align:right;z-index:2;pointer-events:none}
.cards{display:grid;gap:.6rem}
.card{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--pc,var(--line));border-radius:3px;padding:.75rem .9rem}
.card .hd{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.3rem}
.card .hd b{font-family:var(--serif);font-size:1rem;flex:1;min-width:10rem}
.card p{margin:.2rem 0;font-family:var(--serif);line-height:1.55}
.card .act{margin-top:.5rem}
.pill.prova{background:var(--ok-soft);color:var(--ok)}
.pill.decl{background:var(--paper-2);color:var(--muted);border:1px solid var(--line)}
.choice{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.5rem 0 1rem}
.choice button{min-height:56px;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;font:700 1.2rem var(--serif)}
.choice button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.who{display:inline-block;background:var(--ink);color:var(--paper);border-radius:999px;padding:.1rem .6rem;font-size:.8rem;font-weight:600}
.banner .bc{margin:.35rem 0 0;padding-top:.35rem;border-top:1px dashed var(--line)}
.banner .bc .pill{margin-right:.35rem}
.ok-line{color:var(--ok);font-weight:600}
nav.bottom[hidden]{display:none}
:root{--d0:#E8DCBC;--d1:#D8E0D1;--d2:#EAD6D1;--d3:#D5DDE4;--d4:#E3D3BD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--d0:#3B3426;--d1:#2F3A31;--d2:#3E2F2D;--d3:#2D353C;--d4:#3D3226}}
:root[data-theme="dark"]{--d0:#3B3426;--d1:#2F3A31;--d2:#3E2F2D;--d3:#2D353C;--d4:#3D3226}
.cell{background-color:var(--dc);background-size:24px 24px;image-rendering:pixelated;overflow:hidden}
.cell img.spr{position:absolute;left:12%;top:8%;width:76%;height:76%;object-fit:contain;image-rendering:pixelated;z-index:1;pointer-events:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.cell.isob{box-shadow:inset 0 0 0 999px rgba(20,16,12,.22)}
.cell .lbl{z-index:3;left:2px;right:2px;bottom:1px;padding:1px 0;border-radius:2px;background:color-mix(in srgb,var(--paper) 82%,transparent);color:var(--ink)}
.dname{z-index:3;background:color-mix(in srgb,var(--paper) 85%,transparent);padding:1px 2px;border-radius:2px;color:var(--ink)}
.cell .wp{z-index:3;left:auto;background:color-mix(in srgb,var(--paper) 85%,transparent);padding:1px 2px;border-radius:2px}
.cell .tok.pic{width:80%;aspect-ratio:1;border-radius:6px;background:#2a2723;border:2.5px solid var(--pc);overflow:hidden;z-index:4;padding:0}
.cell .tok.pic img{width:100%;height:100%;display:block;image-rendering:pixelated}
.cell .tok.pic.victim img,.av.vic,.tki.vic{filter:grayscale(1) brightness(.85)}
.cell .tok.pic.victim::after{content:"✝";position:absolute;right:2px;top:0;color:var(--red);font:700 .8rem var(--serif);text-shadow:0 0 2px #fff}
.cell .mk,.cell .ax{z-index:3;text-shadow:0 0 3px var(--paper)}
.chip .tk.pic{background:#2a2723;border-radius:5px;width:30px;height:30px;overflow:hidden}
.chip .tk.pic img{width:100%;height:100%;image-rendering:pixelated;display:block}
.av{width:40px;height:40px;image-rendering:pixelated;border-radius:6px;border:2px solid var(--pc,var(--line));background:#2a2723;flex:none}
.pp{display:flex;gap:.7rem;align-items:center}
</style>
</head>
<body>
<header class="top">
  <div class="t"><b>Arquivo Morto</b><span id="hsub">Arquivo de casos</span></div>
  <button class="hbtn" id="helpBtn" type="button">Pedir ajuda</button>
</header>
<main id="main"></main>
<nav class="bottom" id="nav" aria-label="Secções"></nav>
<div class="overlay" id="ov" hidden><div class="panel" role="dialog" aria-modal="true" id="panel"></div></div>
<div class="toast" id="toast" hidden></div>

<script>

    var n=setupN;
    main.innerHTML=intro+'<h2>Quantos jogadores?</h2><div class="choice">'+[1,2,3,4].map(function(i){return '<button type="button" data-n="'+i+'" aria-pressed="'+(n===i)+'">'+i+'</button>';}).join("")+'</div>'+
     (n&&n>1?'<h2>Que jogador és tu?</h2><p class="small muted">Cada pessoa abre o jogo no seu telemóvel, escolhe este caso, o mesmo número de jogadores e um número diferente. Cada um recebe pistas diferentes: só juntando-as se resolve o caso.</p><div class="choice">'+
       Array.from({length:n},function(_,i){return '<button type="button" data-p="'+(i+1)+'">'+(i+1)+'</button>';}).join("")+'</div>':'')+
     (n===1?'<p><button class="btn" type="button" data-p="1">Começar a investigação</button></p>':'')+rules;
    main.querySelectorAll("[data-n]").forEach(function(b){b.onclick=function(){setupN=+b.getAttribute("data-n");vCaso();};});
    main.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){S.mode={n:setupN,p:+b.getAttribute("data-p")};S.start=Date.now();save();go("pistas");};});
    document.getElementById("toArq").onclick=function(){closeCase();render();};
    return;
  }
  var m=S.mode,placed=Object.keys(S.plant).length;
  main.innerHTML=intro+
   (m.n>1?'<p><span class="who">Jogador '+m.p+' de '+m.n+'</span> Tens '+hand().length+' pistas. As outras estão com os teus colegas: falem!</p>':'')+
   '<div class="sheet"><div class="progress"><div><b>'+placed+'/6</b>na planta</div><div><b>'+S.wrong+'</b>acusações erradas</div><div><b>'+S.hints+'</b>ajudas</div></div></div>'+
   '<p><button class="btn" type="button" id="goBtn">'+(S.solved?"Ver a revelação":"Continuar")+'</button></p>'+rules+
   (m.n>1?'<h2>A jogar em grupo</h2><div class="sheet"><ul class="rules"><li>Não mostrem o ecrã: leiam as vossas pistas em voz alta ou digam-nas por palavras vossas.</li><li>Cada um pode fazer a sua planta, ou usam só um telemóvel para a planta.</li><li>Acusam juntos, num só telemóvel.</li><li>Variante competitiva: todos escolhem «1 jogador» e ganha quem resolver primeiro.</li></ul></div>':'')+
   '<h2>Pessoas</h2><div class="sheet">'+PEOPLE.map(function(p){return '<p class="pp">'+av(p.id)+'<span><b>'+p.name+'</b>, '+p.age+'. '+p.role+'</span></p>';}).join("")+'</div>'+
   '<p><button class="btn ghost" type="button" id="resetBtn">Recomeçar este caso ou mudar de jogador</button></p>';
  document.getElementById("toArq").onclick=function(){closeCase();location.hash="caso";render();};
  document.getElementById("goBtn").onclick=function(){go(S.solved?"acusar":"pistas");};
  document.getElementById("resetBtn").onclick=function(){
    panel.innerHTML='<div class="bar"><h2>Recomeçar?</h2><button class="btn ghost" type="button" data-close>Cancelar</button></div><div class="body"><p>Perdes a planta, as acusações e as ajudas deste caso neste telemóvel.</p></div><div class="row"><button class="btn red" type="button" data-reset>Recomeçar</button></div>';
    ov.hidden=false;};
}

/* ---------- PISTAS ---------- */
function cardHTML(c){
  var p=c.about[0];
  return '<article class="card" style="--pc:'+pc(p)+'"><div class="hd">'+av(p)+'<b>'+c.title+'</b><span class="pill '+(c.type==="prova"?"prova":"decl")+'">'+(c.type==="prova"?"Prova":"Declaração")+'</span></div>'+
    '<p>'+c.text+'</p>'+(!c.motive?'<div class="act"><button class="btn ghost" type="button" data-see="'+p+'">Ver na planta</button></div>':'')+'</article>';
}
function vPistas(){
  var h=hand(); h.forEach(function(c){S.seen[c.id]=1;}); save(); renderNav();
  main.innerHTML='<h2>As tuas pistas</h2>'+(S.mode.n>1?'<p class="small muted">Jogador '+S.mode.p+' de '+S.mode.n+'. Partilha-as com o grupo.</p>':'')+
    '<p class="small muted">Declaração: verdadeira, a não ser que uma prova a desminta. Prova: sempre verdadeira.</p>'+
    '<div class="cards">'+h.map(cardHTML).join("")+'</div>';
  main.querySelectorAll("[data-see]").forEach(function(b){b.onclick=function(){selTool=b.getAttribute("data-see");go("planta");};});
}

/* ---------- PLANTA ---------- */
function conflicts(pl){var bad={},ids=Object.keys(pl);ids.forEach(function(a){var p=pl[a];if(cellType(p[0],p[1])==="o") bad[a]=1;
  ids.forEach(function(b){if(a!==b&&(pl[b][0]===p[0]||pl[b][1]===p[1])){bad[a]=1;bad[b]=1;}});});return bad;}
function plantHTML(pl,interactive,refs){
  var who={};Object.keys(pl).forEach(function(id){who[pl[id].join()]=id;});
  var bad=interactive?conflicts(pl):{},usedR={},usedC={};Object.keys(pl).forEach(function(id){usedR[pl[id][0]]=1;usedC[pl[id][1]]=1;});
  var h='<div class="plan" role="grid" aria-label="Planta"><div></div>';
  for(var c=0;c<6;c++) h+='<div class="lab">'+COLS[c]+'</div>';
  for(var r=0;r<6;r++){ h+='<div class="lab">'+(r+1)+'</div>';
    for(c=0;c<6;c++){
      var d=MAP[r][c],k=r+","+c,t=cellType(r,c),cls="cell";
      if(r===0||MAP[r-1][c]!==d) cls+=" wt"; if(r===5||MAP[r+1][c]!==d) cls+=" wb";
      if(c===0||MAP[r][c-1]!==d) cls+=" wl"; if(c===5||MAP[r][c+1]!==d) cls+=" wr";
      if(WIN[k]==="L") cls+=" winL"; if(WIN[k]==="R") cls+=" winR"; if(DOOR[k]) cls+=" doorB";
      if(refs) refs.forEach(function(rf){if(rf.cells&&rf.cells.indexOf(k)>=0) cls+=" ref"; if(rf.div===d) cls+=" refd";});
      var id=who[k]; if(id&&bad[id]) cls+=" conflict"; if(interactive&&lastCell===k) cls+=" sel";
      var first=(r===0||MAP[r-1][c]!==d)&&(c===0||MAP[r][c-1]!==d);
      var inner=(first?'<span class="dname">'+DIV[d]+'</span>':'')+(t==="o"?'<span class="ob"></span>':t==="s"?'<span class="seat"></span>':'');
      var spr=SPR[cellLabel(r,c)];
      if(spr){inner=(first?'<span class="dname">'+DIV[d]+'</span>':'')+'<img class="spr" alt="" src="'+ASSETS[spr]+'">'; if(t==="o") cls+=" isob";}
      var wn=WCELL[k]?WCELL[k].split(" ")[0].toLowerCase():'';
      if(wn&&!first) inner+='<span class="wp">'+wn+'</span>';
      var lb=cellLabel(r,c); if(lb||(wn&&first)) inner+='<span class="lbl">'+lb+(wn&&first?(lb?' · ':'')+wn:'')+'</span>';
      if(id) inner+=tokHTML(id);
      else if(interactive&&S.marks[k]) inner+='<span class="mk">✗</span>';
      else if(interactive&&S.assist&&t!=="o"&&(usedR[r]||usedC[c])) inner+='<span class="ax">✗</span>';
      var tag=interactive?'button':'div';
      h+='<'+tag+(interactive?' type="button"':'')+ ' class="'+cls+'" style="--dc:var(--d'+(Object.keys(DIV).indexOf(d))+')'+(C.floors&&C.floors[d]?';background-image:url('+ASSETS[C.floors[d]]+')':'')+'" data-cell="'+k+'" aria-label="'+esc(describe(r,c))+(id?", "+PBY[id].name:"")+'">'+inner+'</'+tag+'>';
    } }
  return h+'</div>';
}
function vPlanta(){
  var pl=S.plant,bad=conflicts(pl),nb=Object.keys(bad).length,n=Object.keys(pl).length;
  var selP=(selTool&&selTool!=="x")?selTool:null;
  var mine=selP?hand().filter(function(c){return c.about.indexOf(selP)>=0&&!c.motive;}):[];
  var refs=mine.map(function(c){return c.refs;}).filter(Boolean);
  var banner;
  if(selP){
    banner='<div class="banner" style="--pc:'+pc(selP)+'"><b>'+PBY[selP].name+'</b>'+
      (PBY[selP].victim?'<div class="bc">A vítima fica na única posição que sobrar.</div>':'')+
      mine.map(function(c){return '<div class="bc"><span class="pill '+(c.type==="prova"?"prova":"decl")+'">'+(c.type==="prova"?"Prova":"Declaração")+'</span>'+c.text+'</div>';}).join("")+
      (!mine.length&&!PBY[selP].victim?'<div class="bc muted">Não tens pistas sobre esta pessoa.'+(S.mode.n>1?' Pergunta aos colegas.':'')+'</div>':'')+
      (refs.length?'<div class="bc muted small">O sítio referido está assinalado a dourado.</div>':'')+
      '<div class="bc muted small">Toca numa célula para '+(pl[selP]?'mudar de sítio.':'colocar.')+'</div></div>';
  } else banner='<div class="banner">'+(selTool==="x"?'Modo marcar: toca numa célula para pôr ou tirar ✗.':'Toca numa pessoa para ver as tuas pistas sobre ela e depois numa célula para a colocar.')+'</div>';
  main.innerHTML='<h2>'+C.planTitle+'</h2><div class="chips">'+PEOPLE.map(function(p){var at=pl[p.id];
     return '<button type="button" class="chip" data-tool="'+p.id+'" aria-pressed="'+(selTool===p.id)+'" style="--pc:'+pc(p.id)+'"><span class="tk'+(p.victim?' victim':'')+(p.img?' pic':'')+'">'+(p.img?av(p.id,"tki"):p.id)+'</span>'+p.short+(at?' <span class="co">'+coord(at[0],at[1])+'</span>':'')+'</button>';}).join("")+
     '<button type="button" class="chip" data-tool="x" aria-pressed="'+(selTool==="x")+'"><span class="tk" style="background:var(--red)">✗</span>Marcar</button></div>'+
   banner+'<div class="plan-wrap">'+plantHTML(pl,true,refs)+'</div>'+
   '<div class="info">'+(lastCell?esc(describe(+lastCell.split(",")[0],+lastCell.split(",")[1])):"")+'</div>'+
   '<p class="status'+(nb?' bad':'')+'">'+n+'/6 na planta.'+(nb?" Há conflitos: duas pessoas na mesma linha ou coluna, ou alguém num obstáculo.":"")+(n===6&&!nb?' Planta completa: podes acusar.':'')+'</p>'+
   '<label class="toggle"><input type="checkbox" id="assist"'+(S.assist?" checked":"")+'> Riscar automaticamente linhas e colunas ocupadas</label>'+
   '<div class="row">'+(n===6&&!nb?'<button class="btn" type="button" id="toAcc">Acusar</button>':'')+'<button class="btn ghost" type="button" id="clrP">Limpar a planta</button></div>';
  main.querySelectorAll("[data-tool]").forEach(function(b){b.onclick=function(){var t=b.getAttribute("data-tool");selTool=(selTool===t?null:t);vPlanta();};});
  main.querySelectorAll("[data-cell]").forEach(function(b){b.onclick=function(){
    var k=b.getAttribute("data-cell"),rc=k.split(",").map(Number);lastCell=k;
    var occ=Object.keys(S.plant).filter(function(id){return S.plant[id].join()===k;})[0];
    if(selTool&&selTool!=="x"){ if(occ===selTool) delete S.plant[selTool]; else {if(occ) delete S.plant[occ]; S.plant[selTool]=rc; delete S.marks[k];} }
    else if(occ) delete S.plant[occ]; else {if(S.marks[k]) delete S.marks[k]; else S.marks[k]=1;}
    save();vPlanta();};});
  document.getElementById("assist").onchange=function(e){S.assist=e.target.checked;save();vPlanta();};
  document.getElementById("clrP").onclick=function(){S.plant={};S.marks={};lastCell=null;save();vPlanta();};
  var ta=document.getElementById("toAcc"); if(ta) ta.onclick=function(){go("acusar");};
}

/* ---------- ACUSAR ---------- */
function plantCorrect(){return Object.keys(SOL.plant).every(function(id){return S.plant[id]&&S.plant[id].join()===SOL.plant[id].join();});}
function sel(id,label,opts,vals,opt){return '<div class="field"><label for="'+id+'">'+label+'</label><select id="'+id+'"><option value="">'+(opt?"Não sei (sem bónus)":"Escolher…")+'</option>'+
  opts.map(function(o,i){return '<option value="'+esc(vals?vals[i]:o)+'">'+esc(o)+'</option>';}).join("")+'</select></div>';}
function score(motOk){
  var rows=[["Caso resolvido (planta, culpado e arma)",60],["Sem acusações erradas",S.wrong?0:20],["Sem ajudas",S.hints?0:10],["Motivo (bónus)",motOk?10:0]];
  var t=rows.reduce(function(a,r){return a+r[1];},0);
  var cls=t>=95?"Detective lendário":t>=85?"Investigador excepcional":t>=70?"Detective competente":t>=50?"Investigação inconclusiva":"Caso mal resolvido";
  return {rows:rows,total:t,cls:cls,mins:Math.max(1,Math.round(((S.end||Date.now())-S.start)/60000))};
}
function vAcusar(){
  if(S.solved) return vRevelacao();
  var pl=S.plant,n=Object.keys(pl).length,ok=n===6&&!Object.keys(conflicts(pl)).length;
  if(!ok){main.innerHTML='<h2>Acusação</h2><div class="sheet"><p>Primeiro completa a planta: as seis pessoas colocadas e sem conflitos. Tens '+n+'/6.</p></div><p><button class="btn" type="button" id="gp">Ir para a planta</button></p>';
    document.getElementById("gp").onclick=function(){go("planta");};return;}
  main.innerHTML='<h2>Acusação</h2><div class="sheet"><p>A tua planta vai anexada à acusação. Responde de acordo com ela.</p>'+(S.mode.n>1?'<p class="small muted">Em grupo, acusem num só telemóvel, depois de concordarem.</p>':'')+'</div>'+
   sel("fA","Quem matou "+PBY[PEOPLE.filter(function(p){return p.victim;})[0].id].short+"?",SUS.map(function(i){return PBY[i].name;}),SUS)+
   sel("fW","Com que arma?",Object.keys(WEAPONS).map(function(d){return WEAPONS[d].name;}))+
   sel("fM","Porquê? (bónus)",MOTIVOS,null,true)+
   '<div id="vd"></div><div class="row"><button class="btn red" type="button" id="acc">Acusar</button></div>';
  document.getElementById("acc").onclick=function(){
    var a=document.getElementById("fA").value,w=document.getElementById("fW").value,m=document.getElementById("fM").value;
    if(!a||!w){document.getElementById("vd").innerHTML='<div class="verdict bad">Escolhe o culpado e a arma.</div>';return;}
    if(plantCorrect()&&a===SOL.autor&&w===SOL.arma){S.solved=true;S.end=Date.now();S.result=score(m===SOL.motivo);save();render();try{window.scrollTo(0,0);}catch(e){}}
    else{S.wrong++;save();document.getElementById("vd").innerHTML='<div class="verdict bad">A acusação não se sustenta: há algo errado na planta, no culpado ou na arma. '+(S.wrong===1?'Perdes os 20 pontos de «sem acusações erradas». ':'')+'Revê as pistas e tenta outra vez.</div>';}
  };
}
function vRevelacao(){
  var r=S.result||score(false), R=C.reveal;
  main.innerHTML='<section class="folder"><div class="no">'+C.file+' · Encerrado</div><h1>'+R.title+'</h1><p>'+R.lead+'</p></section>'+
   '<div class="sheet"><div class="big">'+r.total+'</div><p><b>'+r.cls+'</b> · '+r.mins+' min</p><table class="t score"><tbody>'+
   r.rows.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+(x[1]>0?'+':'')+x[1]+'</td></tr>';}).join("")+'</tbody></table></div>'+
   '<h2>A planta</h2><div class="plan-wrap">'+plantHTML(SOL.plant,false,null)+'</div>'+
   '<h2>Como se resolve</h2><div class="sheet"><ol>'+R.steps.map(function(s){return '<li>'+s+'</li>';}).join("")+'</ol></div>'+
   '<h2>O que aconteceu</h2><div class="sheet"><p>'+R.story+'</p></div>'+
   '<div class="row"><button class="btn" type="button" id="arq">Arquivo de casos</button><button class="btn ghost" type="button" id="again">Jogar outra vez</button></div>';
  document.getElementById("arq").onclick=function(){closeCase();location.hash="caso";render();};
  document.getElementById("again").onclick=function(){S=fresh();save();setupN=null;go("caso");render();};
}

/* ---------- arranque ---------- */
try{var cur=localStorage.getItem(CURKEY); if(cur) openCase(cur);}catch(e){}
fromHash();
})();

</script>
</body>
</html>
